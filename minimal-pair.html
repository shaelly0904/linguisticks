        <h1>Minimal-pair</h1>
        <p>Minimal pairs are two words or phrases with different meanings that vary by only a single sound (<a href="phoneme.html">phoneme</a></em>).</p>
        <h2>Example</h2>
        <p>In English, <em>pat</em> (/p/) vs. <em>bat</em> (/b/)</p>
        <h2>Related concepts</h2>
        <p>See also: <a href="phoneme.html">Phoneme</a>,  <a href="allophone.html">Allophone</a></p>
