        <h1>Phoneme</h1>
        <p>A phoneme is the smallest unit of sound that distinguishes meaning in a language.</p>
        <h2>For Example</h2>
        <p>In English, /p/ and /b/ are different phonemes: <em>pat</em> vs <em>bat</em>.</p>
        <h2>Related concepts</h2>
        <p>See also: <a href="allophone.html">allophones</a>, <a href="minimal-pair.html">minimal pairs</a>.</p>
