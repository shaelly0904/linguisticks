        <h1>Allophone</h1>
        <p>An allophone is a variation of a single sound unit (a <a href="phoneme.html">phoneme</a>) that changes how a word is pronounced without changing its meaning.</p>
        <h2>Example</h2>
        <p>In English, the aspirated [pʰ] in <em>pin</em> vs the plain [p] in <em>spin</em>.</p>
        <h2>Related concepts</h2>
        <p>See also: <a href="phoneme.html">Phoneme</a>,  <a href="minimal-pair.html">Minimal-pair</a></p>
